lage:
  titel: Oberhausen – mitten in der Metropole Ruhr
  intro: >-
    Die Lage ist das Wichtigste bei einer Immobilie. Oberhausen liegt im Herzen der Metropole Ruhr
    mit über 5 Millionen Einwohnern – mit direktem Autobahnanschluss, ICE-Halt und einem der größten
    Freizeit- und Einkaufsstandorte Deutschlands, der Neuen Mitte.
  kennzahlen:
    - {wert: "213.355", label: Einwohner Oberhausen, sub: "+ rund 4.000 seit 2020"}
    - {wert: "70.812", label: Beschäftigte am Arbeitsort, sub: "über 70.000 – erstmals seit 40 Jahren"}
    - {wert: "> 20 Mio.", label: Besucher pro Jahr, sub: Neue Mitte Oberhausen}
    - {wert: "21 Min.", label: nach Düsseldorf, sub: "ICE ab Oberhausen Hbf · Essen 16 Min."}
  preise:
    kauf: {wert: "2.250 €/m²", label: "Ø Angebotspreis Eigentumswohnung Osterfeld", quelle: "LL Immobilien 2026; Stadt gesamt Ø 2.067–2.171 €/m² (Immowelt 09/2026, Immoportal 08/2026, +3,4 % zum Vorjahr)"}
    miete: {wert: "7,92–9,69 €/m²", label: "Angebotsmieten Osterfeld", quelle: "ImmoScout24 Q2/2026, Engel & Völkers Q3/2026"}
  abschnitte:
    - titel: Bevölkerung
      punkte:
        - "213.355 Einwohner (IT.NRW, 11/2025) – seit dem Tiefpunkt 2020 um rund 4.000 gewachsen."
        - "Stadtbezirk Osterfeld: rund 38.000 Einwohner auf 10,8 km²."
        - "Prognose der Stadt bis 2040: weitgehend stabil (−1,7 %), getragen von Zuzug."
    - titel: Anbindung
      punkte:
        - "A42 mit den Anschlussstellen Oberhausen-Neue Mitte und Bottrop-Süd direkt am Stadtteil; über die A516 zum Kreuz Oberhausen (A2/A3)."
        - "Bahnhof Oberhausen-Osterfeld Süd (RE 44); ab Oberhausen Hbf in 16 Min. nach Essen und 21 Min. nach Düsseldorf."
        - "Flughafen Düsseldorf in rund 30 Autominuten."
    - titel: Arbeitgeber
      punkte:
        - "Everllence (ehem. MAN Energy Solutions) mit rund 2.000 Beschäftigten am Standort."
        - "Stadtverwaltung (~2.800), AMEOS Kliniken (~2.100), Ev. Krankenhaus (~1.350), EVO, Fraunhofer UMSICHT."
        - "Metropole Ruhr: rund 1,83 Mio. sozialversicherungspflichtig Beschäftigte im direkten Umfeld."
    - titel: Neue Mitte & Investitionen
      punkte:
        - "Westfield Centro: 125.000 m² Verkaufsfläche, über 250 Shops – die Neue Mitte zieht über 20 Mio. Besucher pro Jahr an."
        - "Karls Erlebnis-Dorf (eröffnet 07/2026, ca. 45 Mio. €), Topgolf (2022, ca. 50 Mio. €), Casino, Steakhäuser und Restaurant-Promenade."
        - "Rudolf Weber-ARENA mit bis zu 13.000 Plätzen; Gasometer mit über 1 Mio. Besuchern pro Ausstellung."
        - "2026: 15,2 Mio. € Städtebauförderung (Platz 2 in NRW), Umbau Marktstraße (~63 Mio. €), neues Quartier „The LOOP“ für ca. 3.500 Bewohner."
    - titel: Osterfeld
      punkte:
        - "Gewachsener Stadtteil mit Nahversorgung, Schulen und Kitas; neuer Multifunktionskomplex an der Gesamtschule (~15 Mio. €)."
        - "Grün vor der Tür: Revierpark Vonderort (2020–23 revitalisiert) und OLGA-Park."
  quellen: >-
    Quellen: IT.NRW 11/2025; Stadt Oberhausen 2025/2026; Bundesagentur für Arbeit 12/2024; Unibail-Rodamco-Westfield 2019;
    tageskarte.io 2026; EAP-Magazin 2022; DB-Fahrplan 2026; Immowelt, Immoportal, LL Immobilien, ImmoScout24, Engel & Völkers 2026
    (Angebotspreise). Der Homeday-Preisatlas weist für Oberhausen derzeit keine Wohnungspreise aus.

