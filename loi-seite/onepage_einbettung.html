<!-- In Onepage auf der Seite „cqpm-loi“ in einen HTML-/Embed-Block einfügen.
     Kopf- und Fußzeile der Onepage-Seite ausblenden. Die LOI-Seite füllt dann den ganzen Bildschirm.
     Das kleine Skript reicht Zusätze aus dem Link (z. B. ?q=linkedin) an die LOI-Seite weiter. -->
<iframe id="cqpm-loi" src="https://splendid-fox-ec55e5.netlify.app/" title="CQ Property Management – Deine neue digitale Hausverwaltung"
  style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2147483647;background:#fff"
  allow="autoplay; fullscreen; clipboard-write"></iframe>
<script>
  (function () {
    var f = document.getElementById("cqpm-loi");
    if (f && location.search) f.src = "https://splendid-fox-ec55e5.netlify.app/" + location.search;
  })();
</script>
